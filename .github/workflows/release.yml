name: Release + Build + Installer (Windows / macOS / Linux)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  APP_NAME: "euclid"
  # The CLI ships twice: inside APP_NAME, for the machine that runs a euclid, and on its own
  # under this name for every machine that only talks to one.
  CLI_NAME: "euclid-cli"
  INSTALLER_ID: "de.jensvogt.euclid"
  VCPKG_BUILD_TYPE: release
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pull-requests: write
  id-token: write
  pages: write
  actions: write

jobs:
  release-please:
    name: Create Release PR / Tag
    runs-on: ubuntu-latest

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.strip_tag.outputs.clean_tag }}
      prs_created: ${{ steps.release.outputs.prs_created }}

    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: simple
          token: ${{ secrets.GH_AUTH_TOKEN }}

      - name: Strip leading 'v' from tag
        id: strip_tag
        run: |
          TAG="${{ steps.release.outputs.tag_name }}"
          CLEAN="${TAG#v}"   # remove leading 'v'
          echo "clean_tag=$CLEAN" >> $GITHUB_OUTPUT

    # Temporarily disabled - see release.yml history to re-enable.
  build-windows-msi:
    name: Build & Package (Windows MSI)
    runs-on: windows-latest
    needs: [ release-please ]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    env:
      VCPKG_ROOT: "${{ github.workspace }}/vcpkg"
      VCPKG_DEFAULT_BINARY_CACHE: "${{ github.workspace }}/vcpkg-bincache"
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-bincache,readwrite"
      BUILD_DIR: "${{ github.workspace }}/cmake-build-release"
      SEMVER: ${{ needs.release-please.outputs.tag_name }}
      VCPKG_DEFAULT_TRIPLET: x64-windows-static
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Setup MSVC environment
        uses: step-security/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Create vcpkg binary cache dir
        shell: bash
        run: mkdir -p ${{ github.workspace }}/vcpkg-bincache

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-bincache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('**/vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: "${{ github.workspace }}/vcpkg"
          vcpkgJsonGlob: 'vcpkg.json'
          runVcpkgInstall: false

      - name: Build (Backend)
        shell: cmd
        run: |
          mkdir "${{ env.BUILD_DIR }}"
          cmake -B "${{ env.BUILD_DIR }}" -S . -DCMAKE_BUILD_TYPE=Release -DVCPKG_ROOT=${{ env.VCPKG_ROOT}} -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=${{ env.VCPKG_DEFAULT_TRIPLET }} -DVCPKG_DISABLE_AUTO_PACKAGE_REGISTRATION=ON
          cmake --build "${{ env.BUILD_DIR }}" --config Release --parallel 2

      #      - name: Build (Frontend)
      #        shell: pwsh
      #        run: |
      #          # euclid-ui doesn't exist as a separate repo yet - package without a bundled
      #          # frontend until it does, rather than failing the whole release.
      #          git ls-remote https://github.com/jensvogt/euclid-ui.git *>$null
      #          if ($LASTEXITCODE -eq 0) {
      #            git clone https://github.com/jensvogt/euclid-ui
      #            cd euclid-ui
      #            npm install
      #            npm run build
      #          } else {
      #            Write-Warning "jensvogt/euclid-ui not found - packaging without a bundled frontend"
      #            New-Item -ItemType Directory -Force -Path euclid-ui\dist\euclid-ui\browser | Out-Null
      #          }

      - name: Install NSIS
        run: |
          choco install nsis --no-progress -y
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Install NSIS plugins
        run: |
          $pluginDir = "C:\Program Files (x86)\NSIS\Plugins\x86-unicode"
          Copy-Item "${{ github.workspace }}\dist\win32\msi\nsis\INetC.dll" "$pluginDir\"
          Copy-Item "${{ github.workspace }}\dist\win32\msi\nsis\nsJSON.dll" "$pluginDir\"
          Copy-Item "${{ github.workspace }}\dist\win32\msi\nsis\SimpleSC.dll" "$pluginDir\"

      - name: Build NSIS installer
        env:
          SRCDIR: ${{ github.workspace }}
        run: makensis /DSRCDIR=${{ github.workspace }} /DBUILDDIR="${{ env.BUILD_DIR }}" /DVERSION=${{ env.SEMVER }} dist\win32\msi\product.nsi

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: installer-windows
          path: ${{ env.APP_NAME }}-${{ env.SEMVER }}-amd64.exe

      # The CLI on its own, from the same euclid-cli.exe the installer above contains - see
      # dist/win32/msi/cli.nsi.
      - name: Build NSIS CLI installer
        env:
          SRCDIR: ${{ github.workspace }}
        run: makensis /DSRCDIR=${{ github.workspace }} /DBUILDDIR="${{ env.BUILD_DIR }}" /DVERSION=${{ env.SEMVER }} dist\win32\msi\cli.nsi

      - name: Upload Windows CLI installer
        uses: actions/upload-artifact@v7
        with:
          name: cli-installer-windows
          path: ${{ env.CLI_NAME }}-${{ env.SEMVER }}-amd64.exe
          overwrite: true

  build-macos:
    name: Build & Package (macOS)
    runs-on: macos-15
    timeout-minutes: 90
    needs: [ release-please ]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    env:
      VCPKG_ROOT: "${{ github.workspace }}/vcpkg"
      VCPKG_DEFAULT_BINARY_CACHE: "${{ github.workspace }}/vcpkg-bincache"
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-bincache,readwrite"
      BUILD_DIR: "${{ github.workspace }}/build-macos"
      PACKAGE_DIR: "${{ github.workspace }}/package-macos"
      PACKAGE_DIR_CLI: "${{ github.workspace }}/package-macos-cli"
      SEMVER: ${{ needs.release-please.outputs.tag_name }}
      SERVICE_NAME: de.jensvogt.euclid
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Install system dependencies
        shell: bash
        run: |
          brew install doxygen pandoc file autoconf autoconf-archive automake libtool

      - name: Create vcpkg binary cache dir
        run: mkdir -p ${{ github.workspace }}/vcpkg-bincache

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-bincache
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ env.VCPKG_ROOT }}
          vcpkgJsonGlob: 'vcpkg.json'

      - name: Build (Backend)
        run: |
          cmake -B ${{ env.BUILD_DIR }} -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake -DVCPKG_DISABLE_AUTO_PACKAGE_REGISTRATION=ON
          cmake --build ${{ env.BUILD_DIR }} --config Release --parallel 2

      - name: Dump vcpkg failure logs
        if: failure()
        shell: bash
        run: |
          for f in $(find "${{ env.VCPKG_ROOT }}/buildtrees" -iname "*-out.log" -o -iname "*-err.log" -o -iname "*CMakeConfigureLog.yaml.log" 2>/dev/null); do
            echo "===== $f ====="
            tail -n 200 "$f"
            echo
          done

      - name: Build (Frontend)
        shell: bash
        run: |
          # euclid-ui doesn't exist as a separate repo yet - package without a bundled
          # frontend until it does, rather than failing the whole release.
          mkdir -p ${{ github.workspace }}/frontend
          cd ${{ github.workspace }}/frontend
          if git ls-remote https://github.com/jensvogt/euclid-ui.git >/dev/null 2>&1; then
            git clone https://github.com/jensvogt/euclid-ui
            cd euclid-ui
            npm install
            npm run build
          else
            echo "::warning::jensvogt/euclid-ui not found - packaging without a bundled frontend"
            mkdir -p euclid-ui/dist/euclid-ui/browser
          fi

      - name: Prepare package structure
        run: |
          mkdir -p ${{ env.PACKAGE_DIR }}/euclid/bin
          mkdir -p ${{ env.PACKAGE_DIR }}/euclid/etc
          mkdir -p ${{ env.PACKAGE_DIR }}/euclid/log
          mkdir -p ${{ env.PACKAGE_DIR }}/euclid/frontend
          mkdir -p ${{ env.PACKAGE_DIR }}/euclid/init
          mkdir -p ${{ env.PACKAGE_DIR }}/euclid/data/tmp
          mkdir -p ${{ env.PACKAGE_DIR }}/euclid/data/backup
          mkdir -p ${{ env.PACKAGE_DIR }}/euclid/data/esm
          # Tarball root, not under euclid/: it is unpacked at /usr/local, so this lands in
          # /usr/local/share/man/man1 - which macOS lists in /etc/manpaths and man therefore
          # searches. Under euclid/ the pages would install fine and never be found.
          mkdir -p ${{ env.PACKAGE_DIR }}/share/man/man1
          mkdir -p ${{ env.PACKAGE_DIR }}/share/man/man8

          # Everything the build produced, rather than a list that has to be extended by hand
          # whenever a module is added - which is how ekm, ens, emm, ets, eap, ftp and sftp came
          # to be missing from the macOS package while euclid.json still pointed at them, leaving
          # the manager restart-looping on binaries that were not installed. The test executables
          # are built into the same directory and are the only thing skipped.
          for binary in ${{ env.BUILD_DIR }}/bin/euclid-*; do
            case "$(basename "$binary")" in
              *-tests) continue ;;
            esac
            cp "$binary" ${{ env.PACKAGE_DIR }}/euclid/bin/
          done
          cp dist/macos/etc/* ${{ env.PACKAGE_DIR }}/euclid/etc
          # euclid statically links vcpkg's own libmagic, whose compiled magic database format
          # isn't guaranteed compatible with any other libmagic's (see Core::ContentTypeUtils) -
          # take the one this exact build produced instead of a separately maintained copy.
          cp ${{ env.BUILD_DIR }}/vcpkg_installed/arm64-osx/share/libmagic/misc/magic.mgc ${{ env.PACKAGE_DIR }}/euclid/etc/magic.mgc
          cp dist/linux/etc/ssh_host_key ${{ env.PACKAGE_DIR }}/euclid/etc/ssh_host_key
          cp dist/linux/etc/euclid_cert.crt ${{ env.PACKAGE_DIR }}/euclid/etc/euclid_cert.crt
          cp dist/linux/etc/euclid_cert.key ${{ env.PACKAGE_DIR }}/euclid/etc/euclid_cert.key
          cp dist/macos/de.jensvogt.euclid.plist ${{ env.PACKAGE_DIR }}/euclid/etc/
          # Not "|| true": the pages are in the repository, so a copy that fails means something
          # is wrong with the build, and a package that silently ships no documentation is worse
          # than a red build. Compressed because that is what every man reader expects to find.
          cp cli/docs/man/*.1 ${{ env.PACKAGE_DIR }}/share/man/man1/
          # Section 8 is for the daemons the manager runs (euclid-ftp, euclid-sftp), which are
          # administered rather than invoked - a reader looking one up expects it there.
          cp cli/docs/man/*.8 ${{ env.PACKAGE_DIR }}/share/man/man8/
          # The pages carry a version in their .TH line, and nothing bumps it when release-please
          # bumps version.txt - so stamp the version being built rather than shipping whatever the
          # last hand edit left behind. Read from version.txt rather than SEMVER because that file
          # is what the build itself was versioned from, so the pages cannot disagree with the
          # binary they document.
          MAN_VERSION="$(tr -d '[:space:]' < version.txt)"
          sed -i '' -E "1s/(euclid(-cli)? )[0-9]+\.[0-9]+\.[0-9]+/\1${MAN_VERSION}/" \
            ${{ env.PACKAGE_DIR }}/share/man/man1/*.1 ${{ env.PACKAGE_DIR }}/share/man/man8/*.8
          gzip -9n ${{ env.PACKAGE_DIR }}/share/man/man1/*.1 ${{ env.PACKAGE_DIR }}/share/man/man8/*.8
          cp -R ${{ github.workspace }}/frontend/euclid-ui/dist/euclid-ui/browser/* ${{ env.PACKAGE_DIR }}/euclid/frontend/ 2>/dev/null || true

      - name: Verify macOS package contents
        run: |
          # The failure this guards against is a package whose euclid.json names a module binary
          # it does not ship: the manager then restart-loops on an exec that cannot succeed, with
          # nothing in the log but "did not become ready". Cheap to check here, painful to find
          # on an installed system.
          python3 - <<'PYEOF'
          import json, os, sys

          root = "${{ env.PACKAGE_DIR }}"
          config = os.path.join(root, "euclid/etc", "euclid.json")
          modules = json.load(open(config))["euclid"]["modules"]

          missing = []
          for name, module in modules.items():
              if not isinstance(module, dict) or not module.get("active"):
                  continue
              executable = module.get("executable")
              if not executable:
                  continue
              packaged = os.path.join(root, executable.lstrip("/").replace("usr/local/euclid/", "euclid/", 1))
              if not os.path.exists(packaged):
                  missing.append("%s -> %s" % (name, executable))

          if missing:
              print("::error::package is missing binaries its configuration names:")
              for entry in missing:
                  print("  " + entry)
              sys.exit(1)
          print("every active module's binary is packaged")
          PYEOF

      - name: Package Service Files
        run: |
          tar -czf ${{ env.APP_NAME }}-${{ env.SEMVER }}-macos.tgz -C ${{ env.PACKAGE_DIR }} .

      - name: Upload macOS ZIP
        uses: actions/upload-artifact@v7
        with:
          name: installer-macos
          path: ${{ env.APP_NAME }}-${{ env.SEMVER }}-macos.tgz

      # ── CLI-only tarball ───────────────────────────────────────────────────
      # The tarball above unpacks under /usr/local and puts the CLI in
      # /usr/local/euclid/bin, which is where a server keeps it and is not on anybody's PATH.
      # This one is for a Mac that only talks to a euclid elsewhere, so it puts the command in
      # /usr/local/bin and its pages in /usr/local/share/man - both of which macOS already
      # searches, so unpacking it is the whole installation.
      - name: Prepare macOS CLI package
        run: |
          mkdir -p ${{ env.PACKAGE_DIR_CLI }}/bin
          mkdir -p ${{ env.PACKAGE_DIR_CLI }}/share/man/man1

          cp ${{ env.BUILD_DIR }}/bin/euclid-cli ${{ env.PACKAGE_DIR_CLI }}/bin/

          # Section 1 only - section 8 documents the daemons a server runs, which are not here.
          cp cli/docs/man/*.1 ${{ env.PACKAGE_DIR_CLI }}/share/man/man1/
          # Same version stamping as the server package above, with BSD sed's -i argument.
          MAN_VERSION="$(tr -d '[:space:]' < version.txt)"
          sed -i '' -E "1s/(euclid(-cli)? )[0-9]+\.[0-9]+\.[0-9]+/\1${MAN_VERSION}/" \
            ${{ env.PACKAGE_DIR_CLI }}/share/man/man1/*.1
          gzip -9n ${{ env.PACKAGE_DIR_CLI }}/share/man/man1/*.1

          test -x ${{ env.PACKAGE_DIR_CLI }}/bin/euclid-cli \
            || { echo "::error::euclid-cli is missing or not executable in the macOS CLI package"; exit 1; }
          expected=$(ls cli/docs/man/*.1 | wc -l)
          packaged=$(ls ${{ env.PACKAGE_DIR_CLI }}/share/man/man1/*.1.gz | wc -l)
          if [ "$expected" -ne "$packaged" ]; then
            echo "::error::macOS CLI package has ${packaged} man pages, the repository has ${expected}"
            exit 1
          fi

          tar -czf ${{ env.CLI_NAME }}-${{ env.SEMVER }}-macos.tgz -C ${{ env.PACKAGE_DIR_CLI }} .

      - name: Upload macOS CLI tarball
        uses: actions/upload-artifact@v7
        with:
          name: cli-installer-macos
          path: ${{ env.CLI_NAME }}-${{ env.SEMVER }}-macos.tgz
          overwrite: true

  build-linux:
    name: Build & Package (Linux DEB + RPM)
    runs-on: ubuntu-latest
    needs: [ release-please ]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    env:
      CXX: g++-14
      CC: gcc-14
      VCPKG_ROOT: "${{ github.workspace }}/vcpkg"
      VCPKG_DEFAULT_BINARY_CACHE: "${{ github.workspace }}/vcpkg-bincache"
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-bincache,readwrite"
      BUILD_DIR: "${{ github.workspace }}/build-linux"
      PACKAGE_DIR_DEB: "${{ github.workspace }}/package-deb"
      PACKAGE_DIR_RPM: "${{ github.workspace }}/package-rpm"
      PACKAGE_DIR_CLI: "${{ github.workspace }}/package-cli"
      SEMVER: "${{ needs.release-please.outputs.tag_name }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y ninja-build doxygen pandoc linux-libc-dev autoconf autoconf-archive automake libtool g++-14 rpm libgoogle-perftools-dev libmagic-dev
          sudo gem install --no-document fpm

      - name: Create vcpkg binary cache dir
        run: mkdir -p ${{ github.workspace }}/vcpkg-bincache

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-bincache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('**/vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ env.VCPKG_ROOT }}
          vcpkgJsonGlob: 'vcpkg.json'

      - name: Set g++-14 as default
        run: |
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 14
          sudo update-alternatives --set g++ /usr/bin/g++-14
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 14
          sudo update-alternatives --set gcc /usr/bin/gcc-14

      - name: Build (Backend)
        run: |
          mkdir ${{ env.BUILD_DIR }}
          cmake -B ${{ env.BUILD_DIR }} -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake
          cmake --build ${{ env.BUILD_DIR }} --config Release --parallel 2

      - name: Build (Frontend)
        shell: bash
        run: |
          # euclid-ui doesn't exist as a separate repo yet - package without a bundled
          # frontend until it does, rather than failing the whole release.
          mkdir -p ${{ github.workspace }}/frontend
          cd ${{ github.workspace }}/frontend
          if git ls-remote https://github.com/jensvogt/euclid-ui.git >/dev/null 2>&1; then
            git clone https://github.com/jensvogt/euclid-ui
            cd euclid-ui
            npm install
            npm run build
          else
            echo "::warning::jensvogt/euclid-ui not found - packaging without a bundled frontend"
            mkdir -p euclid-ui/dist/euclid-ui/browser
          fi

      # ── DEB ────────────────────────────────────────────────────────────────

      - name: Prepare DEB package structure
        run: |
          mkdir -p ${{ env.PACKAGE_DIR_DEB }}/usr/local/euclid/bin
          mkdir -p ${{ env.PACKAGE_DIR_DEB }}/usr/local/euclid/etc
          mkdir -p ${{ env.PACKAGE_DIR_DEB }}/usr/local/euclid/log
          mkdir -p ${{ env.PACKAGE_DIR_DEB }}/usr/local/euclid/frontend
          mkdir -p ${{ env.PACKAGE_DIR_DEB }}/usr/local/euclid/init
          mkdir -p ${{ env.PACKAGE_DIR_DEB }}/usr/local/euclid/data/tmp
          mkdir -p ${{ env.PACKAGE_DIR_DEB }}/usr/local/euclid/data/backup
          mkdir -p ${{ env.PACKAGE_DIR_DEB }}/usr/local/euclid/data/esm
          mkdir -p ${{ env.PACKAGE_DIR_DEB }}/usr/local/euclid/data/ets
          mkdir -p ${{ env.PACKAGE_DIR_DEB }}/usr/local/euclid/data/eap
          mkdir -p ${{ env.PACKAGE_DIR_DEB }}/usr/local/share/man/man1
          mkdir -p ${{ env.PACKAGE_DIR_DEB }}/usr/local/share/man/man8
          mkdir -p ${{ env.PACKAGE_DIR_DEB }}/etc/systemd/system

          # Everything the build produced, rather than a list that has to be extended by hand
          # whenever a module is added - which is how ekm, ens, emm, ets, eap, ftp and sftp came
          # to be missing from the DEB package while euclid.json still pointed at them, leaving
          # the manager restart-looping on binaries that were not installed. The test executables
          # are built into the same directory and are the only thing skipped.
          for binary in ${{ env.BUILD_DIR }}/bin/euclid-*; do
            case "$(basename "$binary")" in
              *-tests) continue ;;
            esac
            cp "$binary" ${{ env.PACKAGE_DIR_DEB }}/usr/local/euclid/bin/
          done
          cp dist/linux/etc/* ${{ env.PACKAGE_DIR_DEB }}/usr/local/euclid/etc/
          # euclid statically links vcpkg's own libmagic, whose compiled magic database format
          # isn't guaranteed compatible with the system's /usr/lib/file/magic.mgc (see
          # Core::ContentTypeUtils) - bundle the one this exact build produced instead, at the
          # path "magic-file" in euclid.json points to.
          cp ${{ env.BUILD_DIR }}/vcpkg_installed/x64-linux/share/libmagic/misc/magic.mgc ${{ env.PACKAGE_DIR_DEB }}/usr/local/euclid/etc/magic.mgc
          cp dist/linux/systemd/system/euclid.service ${{ env.PACKAGE_DIR_DEB }}/etc/systemd/system/
          # /usr/local/share/man is a mandatory manpath entry on Debian and Ubuntu, so the pages
          # are found without any configuration. Compressed, as Debian policy requires, and not
          # "|| true": these ship from the repository and a missing copy is a build problem.
          cp cli/docs/man/*.1 ${{ env.PACKAGE_DIR_DEB }}/usr/local/share/man/man1/
          # Section 8 is for the daemons the manager runs (euclid-ftp, euclid-sftp), which are
          # administered rather than invoked - a reader looking one up expects it there.
          cp cli/docs/man/*.8 ${{ env.PACKAGE_DIR_DEB }}/usr/local/share/man/man8/
          # The pages carry a version in their .TH line, and nothing bumps it when release-please
          # bumps version.txt - so stamp the version being built rather than shipping whatever the
          # last hand edit left behind. Read from version.txt rather than SEMVER because that file
          # is what the build itself was versioned from, so the pages cannot disagree with the
          # binary they document.
          MAN_VERSION="$(tr -d '[:space:]' < version.txt)"
          sed -i -E "1s/(euclid(-cli)? )[0-9]+\.[0-9]+\.[0-9]+/\1${MAN_VERSION}/" \
            ${{ env.PACKAGE_DIR_DEB }}/usr/local/share/man/man1/*.1 ${{ env.PACKAGE_DIR_DEB }}/usr/local/share/man/man8/*.8
          gzip -9n ${{ env.PACKAGE_DIR_DEB }}/usr/local/share/man/man1/*.1 ${{ env.PACKAGE_DIR_DEB }}/usr/local/share/man/man8/*.8
          cp -R ${{ github.workspace }}/frontend/euclid-ui/dist/euclid-ui/browser/* ${{ env.PACKAGE_DIR_DEB }}/usr/local/euclid/frontend/ 2>/dev/null || true

          # Maintainer scripts live OUTSIDE PACKAGE_DIR_DEB - that whole tree gets mapped
          # verbatim onto the target filesystem root by fpm's "-s dir ... PACKAGE_DIR/=/"
          # below, so anything placed inside it (including a hand-rolled DEBIAN/ directory)
          # ends up installed as literal files rather than treated as package control data.
          mkdir -p ${{ github.workspace }}/deb-scripts
          cat << EOF > ${{ github.workspace }}/deb-scripts/postinstall.sh
          #!/bin/bash
          set -e
          ln -sf /usr/local/euclid/bin/euclid-cli /usr/local/bin/euclid-cli
          ln -sf /usr/local/euclid/bin/euclid-mgr /usr/local/bin/euclid-mgr

          # euclid.service runs as this user, so it has to exist before the service starts, and
          # the tree it reads and writes has to belong to it. Both are done on every install:
          # creating the user is a no-op once it exists, and the chown also repairs an upgrade
          # from a release that ran as root and left root-owned data behind.
          if ! getent group euclid >/dev/null; then
            groupadd --system euclid
          fi
          if ! getent passwd euclid >/dev/null; then
            useradd --system --gid euclid --home-dir /usr/local/euclid \
                    --shell /usr/sbin/nologin --comment "Euclid Cloud Services" euclid
          fi
          chown -R euclid:euclid /usr/local/euclid

          systemctl daemon-reload
          systemctl enable euclid.service
          systemctl restart euclid.service || true
          EOF

          cat << EOF > ${{ github.workspace }}/deb-scripts/postremove.sh
          #!/bin/bash
          set -e
          # dpkg invokes the OLD package's postrm as "postrm upgrade <new-version>" partway
          # through every upgrade, AFTER the new package's files (including this unit file) are
          # already unpacked - so without this guard, a routine upgrade would delete the
          # freshly-installed euclid.service and stop/disable the service right before postinst's
          # "systemctl enable euclid.service" runs against it, which fails with "Unit file
          # euclid.service does not exist" and leaves the package half-configured. Only actually
          # tear down on a real removal/purge, not on upgrade/failed-upgrade/abort-install.
          if [ "\$1" = "remove" ] || [ "\$1" = "purge" ]; then
            systemctl stop euclid.service || true
            systemctl disable euclid.service || true
            rm -f /etc/systemd/system/euclid.service
            rm -f /usr/local/bin/euclid-cli /usr/local/bin/euclid-mgr
          fi
          EOF

          chmod +x ${{ github.workspace }}/deb-scripts/postinstall.sh ${{ github.workspace }}/deb-scripts/postremove.sh

      - name: Verify DEB package contents
        run: |
          # The failure this guards against is a package whose euclid.json names a module binary
          # it does not ship: the manager then restart-loops on an exec that cannot succeed, with
          # nothing in the log but "did not become ready". Cheap to check here, painful to find
          # on an installed system.
          python3 - <<'PYEOF'
          import json, os, sys

          root = "${{ env.PACKAGE_DIR_DEB }}"
          config = os.path.join(root, "usr/local/euclid/etc", "euclid.json")
          modules = json.load(open(config))["euclid"]["modules"]

          missing = []
          for name, module in modules.items():
              if not isinstance(module, dict) or not module.get("active"):
                  continue
              executable = module.get("executable")
              if not executable:
                  continue
              packaged = os.path.join(root, executable.lstrip("/").replace("usr/local/euclid/", "usr/local/euclid/", 1))
              if not os.path.exists(packaged):
                  missing.append("%s -> %s" % (name, executable))

          if missing:
              print("::error::package is missing binaries its configuration names:")
              for entry in missing:
                  print("  " + entry)
              sys.exit(1)
          print("every active module's binary is packaged")
          PYEOF

      - name: Build DEB with fpm
        run: |
          fpm -s dir -t deb --name "${{ env.APP_NAME }}" \
          --version "${{ env.SEMVER }}" \
          --architecture amd64 \
          --license "GPL-3.0-or-later" \
          --maintainer "Jens Vogt <jens.vogt@opitz-consulting.com>" \
          --description "Euclid Cloud Services" \
          --category utils \
          --depends systemd \
          --depends libmagic1 \
          --depends "libgoogle-perftools4 | libgoogle-perftools4t64" \
          --depends libunwind8 \
          --depends liblzma5 \
          --after-install ${{ github.workspace }}/deb-scripts/postinstall.sh \
          --after-remove ${{ github.workspace }}/deb-scripts/postremove.sh \
          --package "${{ env.APP_NAME }}-${{ env.SEMVER }}-amd64.deb" \
          ${{ env.PACKAGE_DIR_DEB }}/=/

      - name: Upload .deb
        uses: actions/upload-artifact@v7
        with:
          name: deb-package-linux
          path: ${{ env.APP_NAME }}-${{ env.SEMVER }}-amd64.deb
          overwrite: true

      # ── RPM ────────────────────────────────────────────────────────────────

      - name: Prepare RPM package structure
        run: |
          mkdir -p ${{ env.PACKAGE_DIR_RPM }}/usr/local/euclid/bin
          mkdir -p ${{ env.PACKAGE_DIR_RPM }}/usr/local/euclid/etc
          mkdir -p ${{ env.PACKAGE_DIR_RPM }}/usr/local/euclid/log
          mkdir -p ${{ env.PACKAGE_DIR_RPM }}/usr/local/euclid/frontend
          mkdir -p ${{ env.PACKAGE_DIR_RPM }}/usr/local/euclid/init
          mkdir -p ${{ env.PACKAGE_DIR_RPM }}/usr/local/euclid/data/tmp
          mkdir -p ${{ env.PACKAGE_DIR_RPM }}/usr/local/euclid/data/backup
          mkdir -p ${{ env.PACKAGE_DIR_RPM }}/usr/local/euclid/data/esm
          mkdir -p ${{ env.PACKAGE_DIR_RPM }}/usr/local/euclid/data/ets
          mkdir -p ${{ env.PACKAGE_DIR_RPM }}/usr/local/euclid/data/eap
          mkdir -p ${{ env.PACKAGE_DIR_RPM }}/usr/local/share/man/man1
          mkdir -p ${{ env.PACKAGE_DIR_RPM }}/usr/local/share/man/man8
          mkdir -p ${{ env.PACKAGE_DIR_RPM }}/etc/systemd/system

          # Everything the build produced, rather than a list that has to be extended by hand
          # whenever a module is added - which is how ekm, ens, emm, ets, eap, ftp and sftp came
          # to be missing from the RPM package while euclid.json still pointed at them, leaving
          # the manager restart-looping on binaries that were not installed. The test executables
          # are built into the same directory and are the only thing skipped.
          for binary in ${{ env.BUILD_DIR }}/bin/euclid-*; do
            case "$(basename "$binary")" in
              *-tests) continue ;;
            esac
            cp "$binary" ${{ env.PACKAGE_DIR_RPM }}/usr/local/euclid/bin/
          done
          cp dist/linux/etc/* ${{ env.PACKAGE_DIR_RPM }}/usr/local/euclid/etc/
          # See the DEB step above for why this is bundled rather than relying on the system's.
          cp ${{ env.BUILD_DIR }}/vcpkg_installed/x64-linux/share/libmagic/misc/magic.mgc ${{ env.PACKAGE_DIR_RPM }}/usr/local/euclid/etc/magic.mgc
          cp dist/linux/systemd/system/euclid.service ${{ env.PACKAGE_DIR_RPM }}/etc/systemd/system
          # Same placement and compression as the DEB above; rpmbuild would compress man pages by
          # itself, but fpm packs the tree verbatim, so it is done here.
          cp cli/docs/man/*.1 ${{ env.PACKAGE_DIR_RPM }}/usr/local/share/man/man1/
          # Section 8 is for the daemons the manager runs (euclid-ftp, euclid-sftp), which are
          # administered rather than invoked - a reader looking one up expects it there.
          cp cli/docs/man/*.8 ${{ env.PACKAGE_DIR_RPM }}/usr/local/share/man/man8/
          # The pages carry a version in their .TH line, and nothing bumps it when release-please
          # bumps version.txt - so stamp the version being built rather than shipping whatever the
          # last hand edit left behind. Read from version.txt rather than SEMVER because that file
          # is what the build itself was versioned from, so the pages cannot disagree with the
          # binary they document.
          MAN_VERSION="$(tr -d '[:space:]' < version.txt)"
          sed -i -E "1s/(euclid(-cli)? )[0-9]+\.[0-9]+\.[0-9]+/\1${MAN_VERSION}/" \
            ${{ env.PACKAGE_DIR_RPM }}/usr/local/share/man/man1/*.1 ${{ env.PACKAGE_DIR_RPM }}/usr/local/share/man/man8/*.8
          gzip -9n ${{ env.PACKAGE_DIR_RPM }}/usr/local/share/man/man1/*.1 ${{ env.PACKAGE_DIR_RPM }}/usr/local/share/man/man8/*.8
          cp -R ${{ github.workspace }}/frontend/euclid-ui/dist/euclid-ui/browser/* ${{ env.PACKAGE_DIR_RPM }}/usr/local/euclid/frontend/ 2>/dev/null || true

          # Maintainer scripts live OUTSIDE PACKAGE_DIR_RPM - see the matching comment in the
          # DEB step above for why (this whole tree is mapped verbatim onto the target
          # filesystem root by fpm below).
          mkdir -p ${{ github.workspace }}/rpm-scripts
          cat << EOF > ${{ github.workspace }}/rpm-scripts/postinstall.sh
          #!/bin/bash
          set -e
          ln -sf /usr/local/euclid/bin/euclid-cli /usr/local/bin/euclid-cli
          ln -sf /usr/local/euclid/bin/euclid-mgr /usr/local/bin/euclid-mgr

          # euclid.service runs as this user, so it has to exist before the service starts, and
          # the tree it reads and writes has to belong to it. Both are done on every install:
          # creating the user is a no-op once it exists, and the chown also repairs an upgrade
          # from a release that ran as root and left root-owned data behind.
          if ! getent group euclid >/dev/null; then
            groupadd --system euclid
          fi
          if ! getent passwd euclid >/dev/null; then
            useradd --system --gid euclid --home-dir /usr/local/euclid \
                    --shell /usr/sbin/nologin --comment "Euclid Cloud Services" euclid
          fi
          chown -R euclid:euclid /usr/local/euclid

          systemctl daemon-reload
          systemctl enable euclid.service
          systemctl restart euclid.service || true
          EOF

          cat << EOF > ${{ github.workspace }}/rpm-scripts/postremove.sh
          #!/bin/bash
          # This runs as the RPM %postun scriptlet, where \$1 is the number of package instances
          # left installed AFTER this action: >=1 during an upgrade (the new version's files are
          # already on disk by this point), 0 only on a genuine full removal. Without this guard,
          # a routine upgrade would delete the freshly-installed euclid.service and stop/disable
          # the service right before postinst's "systemctl enable euclid.service" runs against it -
          # see the matching guard in the DEB postremove.sh above for the same bug on that side.
          if [ "\$1" -eq 0 ]; then
            systemctl stop euclid.service || true
            systemctl disable euclid.service || true
            rm -f /etc/systemd/system/euclid.service
            rm -f /usr/local/bin/euclid-cli /usr/local/bin/euclid-mgr
            systemctl daemon-reload
          fi
          EOF

          chmod +x ${{ github.workspace }}/rpm-scripts/postinstall.sh ${{ github.workspace }}/rpm-scripts/postremove.sh

      - name: Verify RPM package contents
        run: |
          # The failure this guards against is a package whose euclid.json names a module binary
          # it does not ship: the manager then restart-loops on an exec that cannot succeed, with
          # nothing in the log but "did not become ready". Cheap to check here, painful to find
          # on an installed system.
          python3 - <<'PYEOF'
          import json, os, sys

          root = "${{ env.PACKAGE_DIR_RPM }}"
          config = os.path.join(root, "usr/local/euclid/etc", "euclid.json")
          modules = json.load(open(config))["euclid"]["modules"]

          missing = []
          for name, module in modules.items():
              if not isinstance(module, dict) or not module.get("active"):
                  continue
              executable = module.get("executable")
              if not executable:
                  continue
              packaged = os.path.join(root, executable.lstrip("/").replace("usr/local/euclid/", "usr/local/euclid/", 1))
              if not os.path.exists(packaged):
                  missing.append("%s -> %s" % (name, executable))

          if missing:
              print("::error::package is missing binaries its configuration names:")
              for entry in missing:
                  print("  " + entry)
              sys.exit(1)
          print("every active module's binary is packaged")
          PYEOF

      - name: Build RPM with fpm
        run: |
          fpm -s dir -t rpm \
          -n euclid \
          -v ${SEMVER} \
          --description "Euclid - Euclid Cloud Service" \
          --url "https://github.com/jensvogt/euclid" \
          --vendor "Euclid Project" \
          --license "GPL-3.0-or-later" \
          --depends systemd \
          --depends file-libs \
          --depends gperftools-libs \
          --depends libunwind \
          --depends xz-libs \
          --prefix / \
          --after-install ${{ github.workspace }}/rpm-scripts/postinstall.sh \
          --after-remove ${{ github.workspace }}/rpm-scripts/postremove.sh \
          ${{ env.PACKAGE_DIR_RPM }}/=/

      - name: Upload .rpm
        uses: actions/upload-artifact@v7
        with:
          name: rpm-package-linux
          path: ${{ env.APP_NAME }}-${{ env.SEMVER }}-1.x86_64.rpm
          overwrite: true

      # ── CLI-only packages ──────────────────────────────────────────────────
      # The euclid package above already contains euclid-cli, because a server is administered
      # from the machine it runs on. These are for the machine it does not: a workstation, a build
      # agent, a container that talks to a euclid somewhere else and has no business installing a
      # dozen module binaries, a systemd unit and a service account to do it.
      #
      # Built from the same binaries the server packages were built from, in this job rather than
      # a separate one, so the CLI a release ships standalone is byte for byte the one it ships
      # inside the server package.

      - name: Prepare CLI package structure
        run: |
          # One tree for both the DEB and the RPM: unlike the server, the CLI installs no service
          # unit and nothing else a distribution has an opinion about, so there is nothing to
          # differ between them.
          mkdir -p ${{ env.PACKAGE_DIR_CLI }}/usr/local/euclid/bin
          mkdir -p ${{ env.PACKAGE_DIR_CLI }}/usr/local/share/man/man1

          cp ${{ env.BUILD_DIR }}/bin/euclid-cli ${{ env.PACKAGE_DIR_CLI }}/usr/local/euclid/bin/

          # Section 1 only. The section 8 pages document euclid-ftp and euclid-sftp, which are
          # daemons the manager runs - they belong to a server, and shipping them to a machine
          # that has no euclid to run would document commands that are not there.
          cp cli/docs/man/*.1 ${{ env.PACKAGE_DIR_CLI }}/usr/local/share/man/man1/
          # Same version stamping and compression as the server packages above, and for the same
          # reasons - see the DEB step.
          MAN_VERSION="$(tr -d '[:space:]' < version.txt)"
          sed -i -E "1s/(euclid(-cli)? )[0-9]+\.[0-9]+\.[0-9]+/\1${MAN_VERSION}/" \
            ${{ env.PACKAGE_DIR_CLI }}/usr/local/share/man/man1/*.1
          gzip -9n ${{ env.PACKAGE_DIR_CLI }}/usr/local/share/man/man1/*.1

          # Maintainer scripts live OUTSIDE PACKAGE_DIR_CLI - see the matching comment in the
          # server DEB step for why.
          mkdir -p ${{ github.workspace }}/cli-scripts
          cat << EOF > ${{ github.workspace }}/cli-scripts/postinstall.sh
          #!/bin/bash
          set -e
          # The same symlink the server package makes, so "euclid-cli" is the command either way
          # and a script written against one installation works against the other.
          ln -sf /usr/local/euclid/bin/euclid-cli /usr/local/bin/euclid-cli
          EOF

          # No service, no account, no data directory: this package installs a command and its
          # manual, and removing it leaves nothing behind but the symlink it made.
          cat << EOF > ${{ github.workspace }}/cli-scripts/postremove-deb.sh
          #!/bin/bash
          set -e
          # Only on a real removal - dpkg runs the old package's postrm partway through every
          # upgrade, after the new one's files are already unpacked, so removing the symlink
          # unconditionally would delete the one postinst had just created.
          if [ "\$1" = "remove" ] || [ "\$1" = "purge" ]; then
            rm -f /usr/local/bin/euclid-cli
          fi
          EOF

          cat << EOF > ${{ github.workspace }}/cli-scripts/postremove-rpm.sh
          #!/bin/bash
          # \$1 is the number of instances left installed after this action: >=1 during an
          # upgrade, 0 only on a genuine removal. Same guard as the DEB above.
          if [ "\$1" -eq 0 ]; then
            rm -f /usr/local/bin/euclid-cli
          fi
          EOF

          chmod +x ${{ github.workspace }}/cli-scripts/postinstall.sh \
                   ${{ github.workspace }}/cli-scripts/postremove-deb.sh \
                   ${{ github.workspace }}/cli-scripts/postremove-rpm.sh

      - name: Verify CLI package contents
        run: |
          # A CLI package that ships no runnable CLI, or a CLI with no manual, is worth catching
          # here rather than on somebody's workstation.
          test -x ${{ env.PACKAGE_DIR_CLI }}/usr/local/euclid/bin/euclid-cli \
            || { echo "::error::euclid-cli is missing or not executable in the CLI package"; exit 1; }
          test -s ${{ env.PACKAGE_DIR_CLI }}/usr/local/share/man/man1/euclid-cli.1.gz \
            || { echo "::error::euclid-cli.1 is missing from the CLI package"; exit 1; }

          # Every man page the repository ships for the CLI has to be in the package: they are
          # generated by hand alongside each command, and a command whose page was forgotten is
          # invisible to anyone who looks it up rather than guessing.
          expected=$(ls cli/docs/man/*.1 | wc -l)
          packaged=$(ls ${{ env.PACKAGE_DIR_CLI }}/usr/local/share/man/man1/*.1.gz | wc -l)
          if [ "$expected" -ne "$packaged" ]; then
            echo "::error::CLI package has ${packaged} man pages, the repository has ${expected}"
            exit 1
          fi
          echo "euclid-cli and ${packaged} manual pages are packaged"

          # The server package still carries the CLI - that is the whole point of it being in
          # both - so a change that removes it from there would be a regression this catches.
          test -x ${{ env.PACKAGE_DIR_DEB }}/usr/local/euclid/bin/euclid-cli \
            || { echo "::error::the server DEB no longer contains euclid-cli"; exit 1; }
          test -x ${{ env.PACKAGE_DIR_RPM }}/usr/local/euclid/bin/euclid-cli \
            || { echo "::error::the server RPM no longer contains euclid-cli"; exit 1; }

      - name: Build CLI DEB with fpm
        run: |
          # Conflicts/Replaces rather than a shared file: both packages install
          # /usr/local/euclid/bin/euclid-cli, so they are two ways of getting the same command
          # and a machine wants one of them. Declared on this side only - apt then removes
          # whichever is installed before installing the other, in either direction.
          #
          # libgoogle-perftools4 is named libgoogle-perftools4t64 from Ubuntu 24.04 on (the
          # 64-bit time_t transition), so both names are accepted. Every euclid binary links
          # tcmalloc when the build host has it, which on a server is pulled in by everything
          # else - a workstation installing the CLI alone has nothing else to pull it in.
          fpm -s dir -t deb --name "${{ env.CLI_NAME }}" \
          --version "${{ env.SEMVER }}" \
          --architecture amd64 \
          --license "GPL-3.0-or-later" \
          --maintainer "Jens Vogt <jens.vogt@opitz-consulting.com>" \
          --description "Euclid command line interface" \
          --url "https://github.com/jensvogt/euclid" \
          --category utils \
          --depends "libgoogle-perftools4 | libgoogle-perftools4t64" \
          --depends libunwind8 \
          --depends liblzma5 \
          --conflicts "${{ env.APP_NAME }}" \
          --replaces "${{ env.APP_NAME }}" \
          --after-install ${{ github.workspace }}/cli-scripts/postinstall.sh \
          --after-remove ${{ github.workspace }}/cli-scripts/postremove-deb.sh \
          --package "${{ env.CLI_NAME }}-${{ env.SEMVER }}-amd64.deb" \
          ${{ env.PACKAGE_DIR_CLI }}/=/

      - name: Upload CLI .deb
        uses: actions/upload-artifact@v7
        with:
          name: cli-deb-package-linux
          path: ${{ env.CLI_NAME }}-${{ env.SEMVER }}-amd64.deb
          overwrite: true

      - name: Build CLI RPM with fpm
        run: |
          # RPM has no Replaces, so this is Conflicts alone: rpm refuses to have both installed
          # and says which one is in the way, rather than silently swapping them the way apt does.
          fpm -s dir -t rpm \
          -n "${{ env.CLI_NAME }}" \
          -v ${SEMVER} \
          --description "Euclid command line interface" \
          --url "https://github.com/jensvogt/euclid" \
          --vendor "Euclid Project" \
          --license "GPL-3.0-or-later" \
          --depends gperftools-libs \
          --depends libunwind \
          --depends xz-libs \
          --conflicts "${{ env.APP_NAME }}" \
          --prefix / \
          --after-install ${{ github.workspace }}/cli-scripts/postinstall.sh \
          --after-remove ${{ github.workspace }}/cli-scripts/postremove-rpm.sh \
          ${{ env.PACKAGE_DIR_CLI }}/=/

      - name: Upload CLI .rpm
        uses: actions/upload-artifact@v7
        with:
          name: cli-rpm-package-linux
          path: ${{ env.CLI_NAME }}-${{ env.SEMVER }}-1.x86_64.rpm
          overwrite: true

  build-apt-repo:
    name: "Build & Sign APT Repository"
    runs-on: ubuntu-latest
    needs: [ release-please, build-linux ]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    env:
      SEMVER: "${{ needs.release-please.outputs.tag_name }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Download .deb package
        uses: actions/download-artifact@v7
        with:
          name: deb-package-linux
          path: artifacts

      # Into the same repository and the same distribution as the server package: "apt install
      # euclid-cli" on a workstation is the point of it, and it is the same archive and the same
      # signing key that already has to be trusted for "apt install euclid".
      - name: Download CLI .deb package
        uses: actions/download-artifact@v7
        with:
          name: cli-deb-package-linux
          path: artifacts

      - name: Import GPG signing key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.APT_GPG_PASSPHRASE }}

      - name: Install reprepro
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro

      - name: Restore persistent APT repo state
        run: |
          if git ls-remote --exit-code --heads origin apt-repo >/dev/null 2>&1; then
            git fetch origin apt-repo:apt-repo
            git worktree add apt-repo-work apt-repo
          else
            git worktree add --orphan -b apt-repo apt-repo-work
          fi

      - name: Configure reprepro distribution
        run: |
          mkdir -p apt-repo-work/conf
          sed "s/__GPG_KEY_ID__/${{ steps.import_gpg.outputs.fingerprint }}/" dist/apt/conf/distributions > apt-repo-work/conf/distributions

      - name: Add package to APT repo
        run: reprepro -b apt-repo-work includedeb stable artifacts/*.deb

      - name: Export public signing key
        run: gpg --armor --export ${{ steps.import_gpg.outputs.fingerprint }} > apt-repo-work/euclid-archive-keyring.asc

      - name: Commit updated APT repo state
        working-directory: apt-repo-work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add conf dists pool db euclid-archive-keyring.asc
          git commit -m "chore(apt): add ${{ env.SEMVER }}" || echo "No changes to commit"
          git push origin HEAD:apt-repo

      - name: Upload APT repo artifact
        uses: actions/upload-artifact@v7
        with:
          name: apt-repo-site
          path: |
            apt-repo-work/dists
            apt-repo-work/pool
            apt-repo-work/euclid-archive-keyring.asc
          overwrite: true

  build-docker:
    name: "Build & Package (Docker)"
    runs-on: ubuntu-latest
    needs: [ release-please ]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    env:
      GH_TOKEN: ${{ github.token }}
      SEMVER: "${{ needs.release-please.outputs.tag_name }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Check Docker Hub credentials are configured
        run: |
          if [ -z "${{ secrets.DOCKER_USER }}" ] || [ -z "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "::error::DOCKER_USER and/or DOCKER_PASSWORD repository secrets are not set (Settings > Secrets and variables > Actions). Docker Hub username + access token required - see release.yml docs."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker
        uses: docker/build-push-action@v6
        with:
          context: docker
          push: true
          tags: |
            ${{ secrets.DOCKER_USER }}/euclid:${{ env.SEMVER }}
            ${{ secrets.DOCKER_USER }}/euclid:latest
          build-args: |
            GH_TOKEN=${{ env.GH_TOKEN }}
            BUILD_VERSION=${{ env.SEMVER }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        env:
          DOCKER_BUILD_SUMMARY: false

  publish:
    name: Publish Release & Attach Installers
    runs-on: ubuntu-latest
    needs:
      - release-please
      - build-linux
      - build-macos
      - build-windows-msi  # temporarily disabled
    env:
      SEMVER: "${{ needs.release-please.outputs.tag_name }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Download Windows installer
        uses: actions/download-artifact@v7
        with:
          name: installer-windows
          path: artifacts/windows

      - name: Download macOS installer
        uses: actions/download-artifact@v7
        with:
          name: installer-macos
          path: artifacts/macos

      - name: Download macOS CLI tarball
        uses: actions/download-artifact@v7
        with:
          name: cli-installer-macos
          path: artifacts/macos

      - name: Download Windows CLI installer
        uses: actions/download-artifact@v7
        with:
          name: cli-installer-windows
          path: artifacts/windows

      - name: Download Linux Debian package
        uses: actions/download-artifact@v7
        with:
          name: deb-package-linux
          path: artifacts/linux

      - name: Download Linux RPM package
        uses: actions/download-artifact@v7
        with:
          name: rpm-package-linux
          path: artifacts/linux

      - name: Download Linux CLI Debian package
        uses: actions/download-artifact@v7
        with:
          name: cli-deb-package-linux
          path: artifacts/linux

      - name: Download Linux CLI RPM package
        uses: actions/download-artifact@v7
        with:
          name: cli-rpm-package-linux
          path: artifacts/linux

      # The CLI packages land in artifacts/linux alongside the server ones, so the globs below
      # pick them up without naming each file - which is also what keeps a future package from
      # being released only because somebody remembered to add a line here.
      - name: Create GitHub Release (attach installers)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/macos/*.tgz
            artifacts/linux/*.deb
            artifacts/linux/*.rpm
          name: Release ${{ env.SEMVER }}
          tag_name: ${{ env.SEMVER }}
          body: "Automated release for ${{ env.SEMVER }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_AUTH_TOKEN }}

  deploy:
    needs:
      - publish
      - build-apt-repo
    runs-on: ubuntu-latest
    env:
      SEMVER: "${{ needs.release-please.outputs.tag_name }}"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Create site folder
        run: |
          mkdir public
          cp ./artifacts/installer-windows/*.exe public/ || true
          cp ./artifacts/installer-macos/*.tgz public/ || true
          cp ./artifacts/cli-installer-windows/*.exe public/ || true
          cp ./artifacts/cli-installer-macos/*.tgz public/ || true
          cp ./artifacts/deb-package-linux/*.deb public/ || true
          cp ./artifacts/rpm-package-linux/*.rpm public/ || true
          cp ./artifacts/cli-deb-package-linux/*.deb public/ || true
          cp ./artifacts/cli-rpm-package-linux/*.rpm public/ || true
          cp .github/pages/index.html public/index.html || true
          mkdir -p public/apt
          cp -R ./artifacts/apt-repo-site/dists public/apt/
          cp -R ./artifacts/apt-repo-site/pool public/apt/
          cp ./artifacts/apt-repo-site/euclid-archive-keyring.asc public/apt/
          find . -ls

      - name: Generate files.json
        run: |
          cd public
          echo '{ "downloads": [' > files.json
          first=true
          for f in *.{exe,deb,rpm,tgz}; do
            [ -f "$f" ] || continue
            if [ "$first" = true ]; then
              first=false
            else
              echo "," >> files.json
            fi
            size=$(stat -c%s "$f")
            sha=$(sha256sum "$f" | cut -d" " -f1)
            echo "  {\"file\": \"$f\", \"size\": $size, \"sha256\": \"$sha\"}" >> files.json
          done
          echo "]}" >> files.json

      - name: Delete existing github-pages artifact (cleanup for re-runs)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_id=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '[.artifacts[] | select(.name == "github-pages")] | .[0].id // empty')
          if [ -n "$artifact_id" ]; then
            gh api --method DELETE "repos/${{ github.repository }}/actions/artifacts/$artifact_id"
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
