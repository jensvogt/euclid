name: Release + Build + Installer (Windows / macOS / Linux)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  APP_NAME: "euclid"
  INSTALLER_ID: "de.jensvogt.euclid"
  VCPKG_BUILD_TYPE: release
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pull-requests: write
  id-token: write
  pages: write
  actions: write

jobs:
  release-please:
    name: Create Release PR / Tag
    runs-on: ubuntu-latest

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.strip_tag.outputs.clean_tag }}
      prs_created: ${{ steps.release.outputs.prs_created }}

    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: simple
          token: ${{ secrets.GH_AUTH_TOKEN }}

      - name: Strip leading 'v' from tag
        id: strip_tag
        run: |
          TAG="${{ steps.release.outputs.tag_name }}"
          CLEAN="${TAG#v}"   # remove leading 'v'
          echo "clean_tag=$CLEAN" >> $GITHUB_OUTPUT

