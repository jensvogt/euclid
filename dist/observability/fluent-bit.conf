#
# Ships euclid's logs to OpenSearch, in two indexes: what euclid itself wrote, and what the
# applications it runs wrote. See README.md in this directory for what to install where.
#
# Requires euclid.logging.format = "json" and euclid.logging.file-active = true. Both are off by
# default - a text log is what a person reads, and this reads neither.
#

[SERVICE]
    Flush             5
    Daemon            Off
    Log_Level         info
    Parsers_File      parsers.conf
    HTTP_Server       On
    HTTP_Listen       127.0.0.1
    HTTP_Port         2020

    # Buffered to disk rather than only to memory: OpenSearch being unreachable for a few minutes
    # is ordinary, and without this the records written during those minutes are the ones nobody
    # has when they come to ask what happened.
    storage.path      /var/lib/fluent-bit/storage
    storage.sync      normal
    storage.backlog.mem_limit 64M

# ── What euclid writes ──────────────────────────────────────────────────────
#
# The file sink, not journald. journald rate-limits at 10,000 messages per 30 seconds per service
# by default and *drops* the rest - which is exactly what happens during the burst somebody will
# later want to read about. euclid.logging.dir is where these come from.

[INPUT]
    Name              tail
    Tag               euclid.logs
    Path              /usr/local/euclid/log/euclid*.log
    Parser            euclid_json
    Refresh_Interval  5
    Rotate_Wait       30

    # Where the read position is kept, so a restart carries on rather than shipping the file
    # again from the top.
    DB                /var/lib/fluent-bit/euclid.db
    DB.Sync           Normal

    # A line longer than Buffer_Max_Size is skipped rather than split into two records, neither of
    # which would parse. Max must be larger than Chunk or tail refuses to start - and refuses at
    # initialisation, not at "fluent-bit --dry-run", which reports such a config as good.
    #
    # 1 MB is mean for a Java stack trace written as one line and generous for anything else. An
    # application logging JSON puts its trace in a field and stays well inside this.
    Buffer_Chunk_Size 32k
    Buffer_Max_Size   1M
    Skip_Long_Lines   On

    storage.type      filesystem

# No multiline filter, deliberately. A JVM that crashes writes a plain multiline dump to stderr,
# and it is tempting to reassemble it here - but euclid has already split it: the manager reads a
# child's pipe line by line (Controller::drainPipe) and emits one record per line, so by the time
# it reaches this file a stack trace is N separate JSON records each holding one line. There is
# nothing left for a collector to join, and a multiline parser here would only guess at which
# records belong together.
#
# The fix for a trace worth reading is at the other end: an application that logs JSON puts its
# trace in a "stack_trace" field, which arrives whole as one record - which is the whole reason
# for asking applications to log JSON.

# Anything that is not one of euclid's JSON records is dropped here rather than indexed as a
# document with no fields worth querying. Three things produce such a line:
#
#   - a euclid older than the JSON formatter, still writing text;
#   - euclid.logging.format left at "text" by mistake;
#   - half a line, read while the file was being written or rotated.
#
# "channel" is the test because every record the formatter writes has one and nothing else does.
# Without this the first of those three fills the index with junk for as long as it takes somebody
# to notice, which is exactly the period during which nobody is looking at a log system they have
# just installed.
[FILTER]
    Name    grep
    Match   euclid.logs
    Regex   channel .

# ── The split ───────────────────────────────────────────────────────────────
#
# The channel is what euclid already uses to tell its own records from the output of a process it
# started: "app.<applicationId>" for an application, the module's own name for euclid. One rule,
# and the same vocabulary "eap set-log-level" and euclid.logging.channels use - so a dashboard
# filter and the knob that turns the noise down speak about the same thing.

[FILTER]
    Name       rewrite_tag
    Match      euclid.logs
    Rule       $channel ^app\. euclid.app false
    Emitter_Name rewrite_app

# ── Where it goes ───────────────────────────────────────────────────────────
#
# Replace_Dots must stay Off. euclid emits ECS field names as flat dotted keys - "log.level",
# "host.name", "log.origin.line" - which OpenSearch expands into the nested objects the mappings
# in opensearch/ describe. Fluent Bit's default rewrites the dots to underscores, and every one of
# those mappings would then apply to a field that no longer exists.
#
# Suppress_Type_Name is required for OpenSearch 2.x and later, which removed mapping types.

[OUTPUT]
    Name               opensearch
    Match              euclid.logs
    Host               ${OPENSEARCH_HOST}
    Port               ${OPENSEARCH_PORT}
    HTTP_User          ${OPENSEARCH_USER}
    HTTP_Passwd        ${OPENSEARCH_PASSWORD}

    # Both from the environment, because whether the cluster speaks TLS is a property of the
    # cluster and not of this file: a development installation with the security plugin off wants
    # "Off Off", and anything reachable from beyond the host wants "On On". An empty HTTP_User is
    # simply not sent, so the same file serves a cluster with no authentication.
    tls                ${OPENSEARCH_TLS}
    tls.verify         ${OPENSEARCH_TLS_VERIFY}
    Index              euclid-logs
    Time_Key           @timestamp
    Time_Key_Nanos     Off
    Replace_Dots       Off
    Suppress_Type_Name On
    Generate_ID        On
    Retry_Limit        False
    storage.total_limit_size 5G

[OUTPUT]
    Name               opensearch
    Match              euclid.app
    Host               ${OPENSEARCH_HOST}
    Port               ${OPENSEARCH_PORT}
    HTTP_User          ${OPENSEARCH_USER}
    HTTP_Passwd        ${OPENSEARCH_PASSWORD}
    tls                ${OPENSEARCH_TLS}
    tls.verify         ${OPENSEARCH_TLS_VERIFY}
    Index              euclid-app-logs
    Time_Key           @timestamp
    Time_Key_Nanos     Off
    Replace_Dots       Off
    Suppress_Type_Name On
    Generate_ID        On
    Retry_Limit        False
    storage.total_limit_size 5G
