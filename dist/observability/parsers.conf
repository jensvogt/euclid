# euclid writes one JSON object per line when euclid.logging.format is "json", so there is
# nothing to match with a regular expression - the line is already the record.
#
# Time_Keep is On because the timestamp stays in the document as well as becoming the record's
# time. An application's line carries its *own* @timestamp, which is the moment the application
# logged rather than the moment euclid read the pipe, and that is the one worth keeping.
[PARSER]
    Name        euclid_json
    Format      json
    Time_Key    @timestamp
    Time_Format %Y-%m-%dT%H:%M:%S.%LZ
    Time_Keep   On
