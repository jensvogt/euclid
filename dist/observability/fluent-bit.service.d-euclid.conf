#
# Where the collector ships to, as a systemd drop-in rather than in fluent-bit.conf: a cluster's
# address and its credentials belong to the installation and not to a file the repository carries.
#
# Install as /etc/systemd/system/fluent-bit.service.d/euclid.conf
#
# TLS Off and no credentials is a development cluster with the security plugin disabled. For
# anything reachable from beyond the host, set both to On and fill the user and password in -
# an empty HTTP_User is simply not sent, which is what makes one file serve both.
#
[Service]
Environment=OPENSEARCH_HOST=localhost
Environment=OPENSEARCH_PORT=9200
Environment=OPENSEARCH_USER=
Environment=OPENSEARCH_PASSWORD=
Environment=OPENSEARCH_TLS=Off
Environment=OPENSEARCH_TLS_VERIFY=Off
