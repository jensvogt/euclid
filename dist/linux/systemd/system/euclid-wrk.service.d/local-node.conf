# The worker on the manager's own host - docs/worker-nodes.md §13.3.
#
# Shipped by the server package, not the worker package: it is what turns a euclid-wrk installed on
# top of the server package into this installation's local node. The server package does not depend
# on euclid-wrk; without it this is a drop-in for a unit that does not exist, which systemd ignores.
# Remove the server package and this goes with it, and euclid-wrk is a standalone worker again,
# reading its own euclid-wrk.json.
#
# Everything the worker needs is written by the manager when EAP starts - its principal's
# credentials and a configuration generated from the manager's own (the gateway's port and
# certificate, this host's runtimes, a port range of its own). Nothing here is to be edited: change
# euclid.modules.eap.local-node in euclid.json instead, and restart euclid.
[Unit]
Description=Euclid Worker Node (local)
After=euclid.service
Wants=euclid.service

[Service]
# The first ExecStart= clears the one in euclid-wrk.service; a drop-in can only replace it, not add.
ExecStart=
# --wait-for-config, because on a boot or a first install this starts before the manager has
# written the files: without it the worker would fail and be restarted until they appear.
ExecStart=/usr/local/euclid-wrk/bin/euclid-wrk --config /usr/local/euclid/data/local-node/euclid-wrk.json --wait-for-config
