<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
     role="img" aria-label="Euclid">
  <title>Euclid</title>

  <!--
    Small variant, for 16-24px: favicon, tab, tree node, menu item.

    Redrawn rather than scaled. At this size the full circles of the large mark come
    out under half a pixel wide and turn to grey mush, so only the two construction
    arcs that Euclid actually draws survive - each running from one endpoint of the
    base to the apex, which is the whole of Proposition 1 and nothing else.
  -->

  <g fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round">
    <!-- the two compass arcs, B->C about A and A->C about B -->
    <g opacity="0.45" stroke-width="1.1">
      <path d="M 20.5 16.91 A 17 17 0 0 0 12 2.19"/>
      <path d="M 3.5 16.91 A 17 17 0 0 1 12 2.19"/>
    </g>

    <!-- the equilateral triangle -->
    <path d="M 3.5 16.91 L 20.5 16.91 L 12 2.19 Z" stroke-width="2"/>
  </g>
</svg>
